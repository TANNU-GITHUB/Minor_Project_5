# backend/docker-compose.db.yml
# Runs ONLY Postgres + Redis — nothing else
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tonguebridge
      POSTGRES_USER: tb
      POSTGRES_PASSWORD: tb_local_pass_123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb -d tonguebridge"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: